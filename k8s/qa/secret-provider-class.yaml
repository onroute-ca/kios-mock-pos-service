# Azure Key Vault SecretProviderClass for kios-mock-pos-service
# This maps Key Vault secrets to Kubernetes secrets with proper naming
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kios-mock-pos-service-keyvault-secrets
  namespace: mock-pos-qa
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"  # Use AKS managed identity
    userAssignedIdentityID: "465e1485-3db2-4af8-b862-814ff94a5e56"
    keyvaultName: "qa-kios-keyvault"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: AZURE-STORAGE-CONNECTION-STRING
          objectType: secret
          objectAlias: AZURE-STORAGE-CONNECTION-STRING
        - |
          objectName: AZURE-STORAGE-CONTAINER-NAME
          objectType: secret
          objectAlias: AZURE-STORAGE-CONTAINER-NAME
        - |
          objectName: APPLICATIONINSIGHTS-CONNECTION-STRING
          objectType: secret
          objectAlias: APPLICATIONINSIGHTS-CONNECTION-STRING
    tenantId: "ff83d2a0-8cde-411a-957b-fda0a6165994"

  # Create Kubernetes secret from Key Vault secrets
  secretObjects:
    - secretName: kios-mock-pos-service-secrets-qa
      type: Opaque
      data:
        - objectName: AZURE-STORAGE-CONNECTION-STRING
          key: AZURE_STORAGE_CONNECTION_STRING
        - objectName: AZURE-STORAGE-CONTAINER-NAME
          key: AZURE_STORAGE_CONTAINER_NAME
        - objectName: APPLICATIONINSIGHTS-CONNECTION-STRING
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
