spring:
    application:
        name: kios-mock-pos-service

server:
    port: ${SERVER_PORT:8085}
    servlet:
        context-path: /mockpos

# ─── Azure Blob Storage ───────────────────────────────────────────────────────
# Option A – connection string (local / dev only, never commit real values):
#   azure.storage.connection-string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;...
#
# Option B – Managed Identity / DefaultAzureCredential (staging / prod):
#   Comment out connection-string and provide account-url instead.
azure:
    storage:
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING}  # Required – set via env var or .env file (never commit real keys)
        container-name: ${AZURE_STORAGE_KIOS_INTEGRATION_CONTAINER_NAME:kios-integration}
        blob-folder: ${AZURE_STORAGE_BLOB_FOLDER:mock-catalogsync}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always

# ─── Springdoc / Swagger UI ───────────────────────────────────────────────────
springdoc:
    swagger-ui:
        path: /swagger-ui.html
    api-docs:
        path: /v3/api-docs

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
    level:
        com.kios.mock.pos: DEBUG
        com.azure: WARN
